<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>VoxelCraft — a Minecraft-like voxel game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        color: #fff; -webkit-user-select: none; user-select: none;
        touch-action: none; overscroll-behavior: none;
      }
      #game { display: block; width: 100vw; height: 100vh; }

      /* crosshair */
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
        transform: translate(-50%, -50%); pointer-events: none; z-index: 5;
        mix-blend-mode: difference;
      }
      #crosshair::before, #crosshair::after {
        content: ""; position: absolute; background: #fff;
      }
      #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
      #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

      /* HUD */
      #hud {
        position: fixed; left: 10px; top: 10px; z-index: 6;
        font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
        background: rgba(0,0,0,0.35); padding: 6px 10px; border-radius: 8px;
        line-height: 1.4; pointer-events: none; backdrop-filter: blur(2px);
      }
      #flash {
        position: fixed; left: 50%; top: 22%; transform: translateX(-50%);
        z-index: 7; font-size: 18px; font-weight: 600; opacity: 0;
        transition: opacity 0.4s; text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        pointer-events: none;
      }

      /* hotbar */
      #hotbar {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        display: flex; gap: 6px; z-index: 6; padding: 6px;
        background: rgba(0,0,0,0.3); border-radius: 12px; backdrop-filter: blur(3px);
      }
      .slot {
        position: relative; width: 48px; height: 48px; border-radius: 8px;
        background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15);
        display: flex; align-items: center; justify-content: center; cursor: pointer;
        transition: transform 0.08s, border-color 0.1s;
      }
      .slot img { width: 36px; height: 36px; image-rendering: pixelated; }
      .slot.active { border-color: #ffd873; box-shadow: 0 0 0 2px rgba(255,216,115,0.4); transform: translateY(-4px); }
      .slot .num {
        position: absolute; right: 3px; bottom: 1px; font-size: 10px;
        color: #ffe9a8; text-shadow: 0 1px 2px #000;
      }
      #selname {
        position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%);
        z-index: 6; font-size: 13px; opacity: 0.85; text-shadow: 0 1px 3px #000;
        text-transform: capitalize; pointer-events: none;
      }

      /* start overlay */
      #overlay {
        position: fixed; inset: 0; z-index: 20; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 30%, rgba(30,50,90,0.85), rgba(6,10,25,0.95));
        text-align: center; padding: 24px;
      }
      #overlay h1 {
        font-size: clamp(34px, 8vw, 68px); letter-spacing: 2px; margin-bottom: 6px;
        text-shadow: 0 4px 0 #1c3b6e, 0 6px 18px rgba(0,0,0,0.6);
      }
      #overlay .sub { opacity: 0.8; margin-bottom: 26px; font-size: clamp(13px, 3vw, 16px); }
      #overlay .btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
      #overlay button {
        font-size: 17px; font-weight: 600; padding: 12px 26px; border-radius: 10px;
        border: none; cursor: pointer; color: #10203a;
        background: linear-gradient(#ffe9a8, #ffc94d); box-shadow: 0 4px 0 #c98a1e;
        transition: transform 0.08s;
      }
      #overlay button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c98a1e; }
      #overlay #reset-btn { background: linear-gradient(#e8eef7, #b9c6da); box-shadow: 0 4px 0 #7f8ea6; }
      #desktop-help {
        margin-top: 28px; font-size: 14px; line-height: 1.9; opacity: 0.85;
        max-width: 520px;
      }
      #desktop-help kbd {
        background: #223; border: 1px solid #445; border-bottom-width: 3px;
        border-radius: 5px; padding: 1px 7px; font-family: ui-monospace, monospace; font-size: 12px;
      }

      /* underwater tint */
      #water-overlay {
        position: fixed; inset: 0; z-index: 4; pointer-events: none;
        background: rgba(30,90,200,0.35); opacity: 0; transition: opacity 0.25s;
      }

      /* mobile touch controls */
      #touch-controls { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
      #joystick {
        position: absolute; left: 26px; bottom: 26px; width: 120px; height: 120px;
        border-radius: 50%; background: rgba(255,255,255,0.12);
        border: 2px solid rgba(255,255,255,0.25); pointer-events: auto;
        touch-action: none;
      }
      #joy-knob {
        position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
        margin: -27px 0 0 -27px; border-radius: 50%;
        background: rgba(255,255,255,0.5); border: 2px solid rgba(255,255,255,0.7);
      }
      #touch-buttons {
        position: absolute; right: 20px; bottom: 24px; display: grid;
        grid-template-columns: 68px 68px; gap: 12px; pointer-events: auto;
      }
      .tbtn {
        width: 68px; height: 68px; border-radius: 50%; font-size: 24px; color: #fff;
        background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.3);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        -webkit-tap-highlight-color: transparent; touch-action: none;
      }
      .tbtn span { font-size: 10px; opacity: 0.8; margin-top: 1px; }
      .tbtn:active { background: rgba(255,255,255,0.32); }

      @media (max-width: 520px) {
        .slot { width: 38px; height: 38px; }
        .slot img { width: 28px; height: 28px; }
        #hotbar { bottom: 108px; }
        #selname { bottom: 152px; }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="crosshair"></div>
    <div id="hud">loading…</div>
    <div id="flash"></div>
    <div id="selname"></div>
    <div id="hotbar"></div>
    <div id="water-overlay"></div>

    <div id="overlay">
      <h1>VOXELCRAFT</h1>
      <div class="sub">An open-world voxel sandbox — build, mine, and explore.</div>
      <div class="btns">
        <button id="play-btn">▶ Play</button>
        <button id="reset-btn">↻ New World</button>
      </div>
      <div id="desktop-help">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>Shift</kbd> sprint</div>
        <div><kbd>Mouse</kbd> look &nbsp; <kbd>Left-click</kbd> mine &nbsp; <kbd>Right-click</kbd> place</div>
        <div><kbd>1</kbd>–<kbd>0</kbd> / scroll select block &nbsp; <kbd>F</kbd> fly &nbsp; <kbd>G</kbd> save</div>
        <div style="opacity:0.6;margin-top:6px">Click the screen to capture the mouse. Progress auto-saves.</div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
